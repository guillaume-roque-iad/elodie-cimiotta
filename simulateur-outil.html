</style>
<script>
(()=>{
const root=document.getElementById('tribu-guide');
const el=id=>root.querySelector('#'+id);
const euro=v=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v);
const price=v=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(v);
const signed=v=>(v>0?'+':'')+euro(v);
const s={profile:'pro',sales:12,fee:7000,share:0,ca:100000,current:50,currentPack:150,year:'2026',production:'yes',starter:'standard',activation:'2026-01-01',first:4,extension:'no',team:'no',count:3,teamca:50000,currentTeam:0,bonus:'none',boostcohort:'new',boostcap:0,boostbase:50000,boostok:false,cap:5,prev:10000,now:20000,tiprole:'manager',tippros:3,affiliation:false,grade:'bronze',used:0,tipca:150000,tipexcluded:0,tipmonths:24,approved:false};
s.tipfuture=0;s.tiprole='leader';s.tipshare=100;for(let i=0;i<500;i++){s['tipy1_'+i]=50000;s['tipy2_'+i]=50000;}
s.propertips=50;s.secondSale=13;s.arrival='new';s.student=false;
s.newCount=1;s.newStart='2026-07';s.newCA=50000;s.special='no';s.excludedShare=0;
Object.assign(s,{agencyEnabled:'no',agencyRent:0,agencyStaff:0,agencyPortals:0,agencyFranchise:0,agencyOther:0,agencyFuture:0,agencyTransition:0});
if(new URLSearchParams(location.search).get('profil')==='equipe'){s.profile='manager';s.team='yes';}
let index=0;
const team=()=>s.profile==='manager'||s.team==='yes';
function automatic(){s.production='yes';if(s.bonus==='none'||s.bonus==='booster')s.bonus=team()&&s.count>0&&s.count<5?'booster':'none';s.starter=s.arrival==='existing'?'none':s.student?'young':'standard';}
function steps(){automatic();return ['profile','activity',...(s.profile==='beginner'?[]:['compare']),...(s.profile==='manager'?['agencyChoice',...(s.agencyEnabled==='yes'?['agencyRent','agencyStaff','agencyPortals','agencyFranchise','agencyOther','agencyFuture','agencyTransition']:[])]:[]),'starter',...(s.starter==='none'?[]:['starttiming']),...(s.profile==='manager'?[]:['team']),...(team()?['teamsize',...(s.profile==='beginner'?[]:['currentteam']),'bonus',...(s.bonus==='growth'?['growth']:s.bonus==='tip'?['tipaccess','tipamount']:[])]:[])];}
const examples={newCount:[[1,'1 conseiller'],[2,'2 conseillers'],[3,'3 conseillers']],newCA:[[30000,'30 000 €'],[50000,'50 000 €'],[70000,'70 000 €']],excludedShare:[[0,'0 %'],[50,'50 %'],[100,'100 %']],propertips:[[0,'Aucun'],[25,'25 apporteurs'],[50,'50 apporteurs'],[75,'75 apporteurs']],tippros:[[3,'3 professionnels'],[5,'5 professionnels'],[10,'10 professionnels']],used:[[0,'Aucun'],[1,'1 TIP'],[2,'2 TIP']],tipca:[[90000,'90 000 €'],[150000,'150 000 €'],[300000,'300 000 €']],tipexcluded:[[0,'Aucune exclusion'],[30000,'30 000 €'],[60000,'60 000 €']],sales:[[3,'3 ventes'],[6,'6 ventes'],[12,'12 ventes'],[24,'24 ventes']],fee:[[5000,'5 000 €'],[7000,'7 000 €'],[10000,'10 000 €']],ca:[[50000,'50 000 €'],[100000,'100 000 €'],[150000,'150 000 €']],current:[[50,'50 %'],[70,'70 %'],[80,'80 %']],currentPack:[[0,'Sans abonnement'],[100,'100 €'],[150,'150 €'],[200,'200 €']],count:[[1,'1 conseiller'],[3,'3 conseillers'],[5,'5 conseillers'],[10,'10 conseillers']],teamca:[[30000,'30 000 €'],[50000,'50 000 €'],[70000,'70 000 €']],currentTeam:[[0,'Aucun revenu'],[5000,'5 000 €'],[15000,'15 000 €']],boostcap:[[0,'Aucun'],[2,'2 filleuls'],[4,'4 filleuls']],boostbase:[[10000,'10 000 €'],[30000,'30 000 €'],[50000,'50 000 €']],cap:[[5,'5 filleuls'],[15,'15 filleuls'],[30,'30 filleuls']],prev:[[5000,'5 000 €'],[10000,'10 000 €'],[20000,'20 000 €']],now:[[10000,'10 000 €'],[20000,'20 000 €'],[30000,'30 000 €']]};
function field(k,label,unit,min=0,max=10000000,step=1){const choices=(examples[k]||[]).filter(([v])=>v>=min&&v<=max);return `<label for="tg-${k}">${label}</label><div class="tg-number"><input id="tg-${k}" data-field="${k}" type="number" inputmode="decimal" min="${min}" max="${max}" step="${step}" value="${s[k]}"><span class="tg-unit">${unit}</span></div>${choices.length?`<div class="tg-chips" role="group" aria-label="Exemples : ${label}">${choices.map(([v,t])=>`<button type="button" class="tg-chip cursor-interaction" data-example="${k}" data-amount="${v}">${t}</button>`).join('')}</div><p class="tg-hint">Exemples modifiables : choisissez une valeur ou saisissez la vôtre.</p>`:''}`;}
function select(k,label,opts){return `<label for="tg-${k}">${label}</label><select id="tg-${k}" data-select="${k}">${opts.map(([v,t])=>`<option value="${v}" ${String(s[k])===String(v)?'selected':''}>${t}</option>`).join('')}</select>`;}
function check(k,label){return `<label class="tg-check"><input type="checkbox" data-check="${k}" ${s[k]?'checked':''}><span>${label}</span></label>`;}
function options(k,opts){return '<div class="tg-options">'+opts.map(([v,t,sub])=>`<button type="button" class="tg-option cursor-interaction" data-key="${k}" data-value="${v}" aria-pressed="${s[k]===v}"><span class="tg-dot" aria-hidden="true"></span><span><b>${t}</b>${sub?`<small>${sub}</small>`:''}</span></button>`).join('')+'</div>';}
const hint=t=>`<p class="tg-hint">${t}</p>`;
const pages={
 profile:()=>['Votre projet','Quel est votre point de départ ?','Votre parcours s’adapte à vos réponses.',options('profile',[['beginner','Je débute dans l’immobilier','Estimer mes commissions et mes aides au démarrage.'],['pro','Je suis déjà conseiller','Voir ce que je pourrais gagner en plus avec iad.'],['manager','Je dirige une équipe','Comparer mes revenus et les dispositifs vérifiés.']])],
 agencyChoice:()=>['Votre budget','Avez-vous des charges d’agence à comparer ?','Cette étape est facultative. Vos abonnements sont déjà pris en compte dans le simulateur.',options('agencyEnabled',[['no','Non, continuer ma simulation','Conserver la comparaison des revenus et des abonnements.'],['yes','Oui, comparer mes charges','Répondre à quelques questions sur mes dépenses actuelles et futures.']])],
 agencyRent:()=>['Vos charges actuelles','Combien coûtent vos locaux chaque mois ?','Indiquez uniquement le loyer et les dépenses liées à vos locaux.',field('agencyRent','Loyer et locaux','€ HT / mois')+hint('Saisissez 0 si vous n’avez pas de locaux à votre charge.')],
 agencyStaff:()=>['Vos charges actuelles','Quel est votre budget mensuel de personnel ?','Salaires et charges employeur supportés par votre structure.',field('agencyStaff','Salaires et charges employeur','€ / mois')+hint('Saisissez 0 si vous n’employez pas de personnel.')],
 agencyPortals:()=>['Vos charges actuelles','Combien payez-vous pour diffuser vos annonces ?','Indiquez vos dépenses de portails et de diffusion payées en plus de votre abonnement actuel.',field('agencyPortals','Portails et diffusion','€ HT / mois')+hint('Ne comptez pas une dépense déjà incluse dans votre abonnement.')],
 agencyFranchise:()=>['Vos charges actuelles','Payez-vous une redevance supplémentaire ?','Franchise ou redevance payée en plus de l’abonnement déjà renseigné.',field('agencyFranchise','Redevances supplémentaires','€ HT / mois')+hint('Saisissez 0 si cette dépense est incluse dans votre abonnement ou si vous n’en avez pas.')],
 agencyOther:()=>['Vos charges actuelles','Quelles autres dépenses avez-vous chaque mois ?','Par exemple : assurances, comptabilité, logiciels, publicité ou déplacements. Ne recomptez pas les dépenses déjà saisies.',field('agencyOther','Autres dépenses actuelles','€ HT / mois')],
 agencyFuture:()=>['Votre futur budget','Quelles dépenses garderez-vous chez iad ?','Indiquez le total mensuel de vos charges conservées et nouvelles, hors pack iad : celui-ci est déjà calculé automatiquement.',field('agencyFuture','Total des charges futures hors pack iad','€ HT / mois')+hint('Incluez notamment les dépenses qui restent à votre charge. Une charge ne disparaît que si vous pouvez effectivement y mettre fin.')],
 agencyTransition:()=>['Votre transition','Prévoyez-vous des frais pour votre changement ?','Renseignez les dépenses ponctuelles liées à votre transition.',field('agencyTransition','Frais ponctuels de transition','€ HT')+hint('Ce montant est déduit une seule fois, en première année. Saisissez 0 si vous n’en prévoyez pas.')],
 activity:()=>['Votre activité',s.profile==='beginner'?'Combien de ventes envisagez-vous ?':'Quelle activité souhaitez-vous comparer ?','Production+ 2026 est calculé automatiquement à partir de votre activité, frais du dispositif déduits.',s.profile==='beginner'?field('sales','Ventes sur l’année','ventes',0,300)+field('fee','Honoraires moyens par vente','€ HT avant commission',0,100000)+select('share','Part de vos ventes en partage à 50/50',[[0,'Aucune'],[25,'Une vente sur quatre'],[50,'Une vente sur deux'],[100,'Toutes']]):field('ca','Chiffre d’affaires personnel','€ HT après partage, avant commission')+field('sales','Nombre de transactions','transactions',1,500)+hint('Le calcul professionnel suppose des transactions de même montant, sans partage. Pour des ventes partagées, le détail devra être affiné.')],
 compare:()=>['Votre situation actuelle','Que percevez-vous aujourd’hui ?','Ces deux chiffres rendent la comparaison plus juste.',field('current','Pourcentage de commission','%',0,100,0.1)+field('currentPack','Abonnement actuel','€ HT / mois',0,10000,0.01)],
 production:()=>['Production+','Voulez-vous inclure le bonus de production ?','Le supplément lié à vos ventes est calculé après les frais du dispositif.',options('production',[['yes','Oui, simuler Production+','Le taux évolue au fil des transactions éligibles.'],['no','Non, garder le taux de base','Commission personnelle de 69 %.']])+hint(s.year==='2027'?'Le règlement disponible couvre 2026 : aucun bonus Production+ ne sera ajouté pour 2027.':'Projection sur toute l’année 2026, compteur initial à zéro. Ce n’est pas une prévision sur les 12 mois à venir.')],
 starter:()=>['Votre situation','S’agit-il de votre arrivée chez iad ?','Le simulateur applique automatiquement le tarif correspondant à votre situation.',options('arrival',[['new','Oui, je simule mon arrivée chez iad','Starter+ est pris en compte selon ma date de début.'],['existing','Non, ma période de démarrage est terminée','Mon budget utilise le pack standard.']])+(s.arrival==='new'?check('student','J’ai été étudiant au moins 3 mois entre le 01/07/2025 et le 30/06/2027, avec justificatif validé.'):'')+hint(s.arrival==='new'?(s.student?'Offre Jeunes actifs retenue automatiquement, sous réserve de la date d’activation.':'Starter+ : 99 € HT / mois jusqu’à la première vente, pendant 6 mois maximum, renouvelable 6 mois avec 50 apporteurs Propertips. Puis pack standard à 166,58 € HT / mois.'):'Aucune remise de démarrage ajoutée.')],
 starttiming:()=>s.starter==='standard'?['Starter+ · 6 mois + 6 mois','Quand prévoyez-vous votre première vente ?','99 € HT / mois jusqu’à votre première vente. Durée maximale : 6 mois, renouvelable 6 mois avec 50 apporteurs Propertips. Après l’offre : 166,58 € HT / mois.',`<label for="tg-activation">Date d’activation envisagée</label><input id="tg-activation" data-date="activation" type="date" value="${s.activation}" required>`+field('propertips','Apporteurs inscrits à la fin des 6 premiers mois','apporteurs',0,10000)+select('first','Première vente réalisée après votre arrivée',Array.from({length:13},(_,i)=>[i+1,i===12?'Aucune vente pendant les 12 premiers mois':`Au ${i+1}${i===0?'er':'e'} mois`]))+hint('Arrêt de la remise dès la première vente, même pendant les 6 premiers mois. Pour cet exemple mensuel, le mois de cette vente est compté au tarif standard, sans prorata. Règle de renouvellement précisée par Guillaume le 6 octobre 2026.')]:['Votre démarrage','Quand commencez-vous et quand vendez-vous ?','Offre Jeunes actifs : conditions du règlement fourni.',`<label for="tg-activation">Date d’activation envisagée</label><input id="tg-activation" data-date="activation" type="date" value="${s.activation}" required>`+select('first','Première vente payée après votre activation',Array.from({length:13},(_,i)=>[i+1,i===12?'Aucune pendant les 12 premiers mois':`Mois ${i+1}`]))+select('extension','Prolongation de l’offre Jeunes actifs',[['no','Non / pas encore accordée'],['yes','Oui, prolongation accordée']])+hint('Les précisions ajoutées à Starter+ ne sont pas étendues automatiquement à l’offre Jeunes actifs. Budget sur 12 factures entières.')],
 team:()=>['Votre équipe','Souhaitez-vous parrainer des conseillers ?','Vous pouvez estimer cette activité en complément de vos ventes.',options('team',[['no','Pas pour le moment','Continuer avec mon activité personnelle.'],['yes','Oui, développer mon équipe','Ajouter mes conseillers directs.']])],
 teamsize:()=>['Votre équipe','Quelle activité pour votre équipe directe ?','Sans vous compter. Les niveaux 2 à 5 ne sont pas inclus dans cet essai.',field('count','Conseillers directs actifs','conseillers',0,500)+field('teamca','CA moyen sur l’année simulée','€ HT / conseiller')+hint('Adaptez le CA au temps de présence réel de vos conseillers sur l’année.')],
 currentteam:()=>['Votre comparaison','Que rapporte déjà votre équipe aujourd’hui ?','Nous le déduisons pour afficher seulement le gain supplémentaire.',field('currentTeam','Commissions managériales actuelles','€ HT / an')],
 bonus:()=>['Votre équipe','Souhaitez-vous aller plus loin ?',s.count>0&&s.count<5?'Booster+ est déjà estimé automatiquement pour votre équipe.':'Les récurrences de votre équipe sont déjà calculées.',options('bonus',[[s.count>0&&s.count<5?'booster':'none','Voir mon résultat','Aucune autre information à saisir.'],['growth','Estimer Croissance+','Comparer la progression de mes récurrences.'],['tip','Estimer le TIP','Simuler l’intégration d’une équipe de professionnels.']])],

 growth:()=>['Croissance+','De combien progressent vos récurrences ?','Comparez deux périodes complètes du 1er juillet au 30 juin.',field('cap','Effectif total au 1er juillet de début de période','filleuls activés',0,10000)+field('prev','Récurrences de la période précédente','€ HT')+field('now','Récurrences de la période étudiée','€ HT')+hint('Le bonus calculé sera inclus dans votre gain de première année. Ce scénario remplace le TIP ou Booster+ ; les autres cumuls restent soumis aux conditions du dispositif.')],
 tipaccess:()=>['TIP · votre projet','Quel est votre rôle dans le projet ?','Sans minimum de chiffre d’affaires de 180 000 €.',options('tiprole',[['leader','Je rejoins iad avec mon équipe','Je simule le bonus reversé par le manager intégrateur.'],['manager','J’intègre une équipe chez iad','Je simule le bonus TIP du manager intégrateur.']])+field('tippros','Équipe au démarrage, Team Leader compris','professionnels',3,250)+field('tipfuture','Futures intégrations prévues pendant les 24 mois','professionnels',0,250)+hint('Les futures intégrations dans la branche TIP sont aussi prises en compte dans le bonus de 10 %, pendant la durée restante du dispositif.')+check('affiliation','Même enseigne au niveau national, ou enseignes différentes dans le même bassin d’emploi.')+select('grade','Qualification du manager intégrateur',[['bronze','Bronze'],['argent','Argent'],['or','Or'],['platinum','Platinum ou supérieur']])+field('used','TIP déjà retenus cette année pour ce manager','TIP',0,1000)],
 tipamount:()=>['TIP · activité prévue','Quel chiffre d’affaires prévoit chaque personne ?','Indiquez le CA prévu dans chaque année du TIP, y compris pour les futures intégrations. Saisissez 0 avant leur arrivée, puis uniquement le CA prévu pendant la durée restante du TIP.',`<div class="tg-tip-grid"><div class="tg-tip-head"><span>Votre équipe</span><span>Année 1<small>Honoraires HT / an</small></span><span>Année 2<small>Honoraires HT / an</small></span></div>${Array.from({length:s.tippros+s.tipfuture},(_,i)=>`<div class="tg-tip-row"><div class="tg-tip-person">${i===0?'Team Leader':i<s.tippros?'Conseiller '+i:'Future intégration '+(i-s.tippros+1)}<small>${i===0?'Responsable de l’équipe':'Membre de l’équipe'}</small></div>${[1,2].map(y=>`<div class="tg-tip-cell"><label for="tg-tipy${y}_${i}"><span class="tg-tip-mobile">Année ${y}</span><span class="tg-tip-sr"> · ${i===0?'Team Leader':i<s.tippros?'Conseiller '+i:'Future intégration '+(i-s.tippros+1)} · Honoraires HT par an</span></label><div class="tg-tip-input"><input id="tg-tipy${y}_${i}" data-field="tipy${y}_${i}" type="number" inputmode="decimal" min="0" max="10000000" step="1" value="${s['tipy'+y+'_'+i]}"><span>€ HT</span></div></div>`).join('')}</div>`).join('')}</div>`+(s.tiprole==='leader'?field('tipshare','Part du bonus reversée au Team Leader','%',0,100)+hint('Exemple : 100 % correspond au reversement intégral simulé dans le fichier du siège, à convenir avec le manager intégrateur.'):'')]

};
function compute(){
 automatic();
 const factor=s.profile==='beginner'?1-Number(s.share)/200:1;
 const ca=s.profile==='beginner'?s.sales*s.fee*factor:s.ca;
 const per=s.sales?ca/s.sales:0;let gross=0,fees=0;const transactions=[];
 if(s.production==='yes'&&s.year==='2026'&&per>0){for(let i=0;i<s.sales;i++){
  const prior=Math.round(i*per*100)/100;const rate=prior>100000?.85:prior>80000?.80:prior>=65000?.75:.69;
  const fee=(prior>100000?290:prior>80000?240:prior>=65000?190:0)*factor;
  const bonus=per*(rate-.69);gross+=bonus;fees+=fee;transactions.push([i+1,prior,rate,bonus,fee]);
 }}
 const prod=gross-fees,base=ca*.69;
 const eligible=s.starter!=='none'&&s.activation>='2025-03-25'&&s.activation<='2027-06-30'&&(s.starter!=='young'||s.activation>='2025-07-01');
 const months=eligible?(s.starter==='standard'?Math.max(0,Math.min(s.propertips>=50?12:6,Number(s.first)-1)):Math.min(Number(s.first),s.extension==='yes'?12:6)):0;
 const saving=Math.min(months,6)*(166.58-(s.starter==='young'?19.90:99))+Math.max(0,months-6)*(166.58-99);
 const pack=166.58*12-saving;
 s.newCount=s.count;const startMonth=1;
 const newMonths=13-startMonth,monthlyCA=s.teamca/12;
 let boosterCA=0,productionExcluded=0;
 for(let i=0;i<newMonths;i++){if(Math.round(i*monthlyCA*100)/100>=65000)productionExcluded+=monthlyCA;else boosterCA+=monthlyCA;}
 const newTotal=s.newCount*monthlyCA*newMonths;
 const otherExcluded=0;
 boosterCA=boosterCA*s.newCount-otherExcluded;
 const teamBase=team()?(s.bonus==='booster'?((s.count-s.newCount)*s.teamca+newTotal):s.count*s.teamca)*.07:0;
 const boostValid=team()&&s.bonus==='booster'&&s.count>0&&s.count<5;
 const boostRate=.03;
 const boost=boostValid?boosterCA*boostRate:0;
 const growth=team()&&s.bonus==='growth'?Math.max(0,s.now-s.prev)*(s.cap>=30?.15:s.cap>=5?.10:0):0;
 const quota={bronze:1,argent:2,or:3,platinum:Infinity}[s.grade];
 const tipRows=Array.from({length:s.tippros+s.tipfuture},(_,i)=>[Number(s['tipy1_'+i]||0),Number(s['tipy2_'+i]||0)]);
 const tipBases=[0,1].map(y=>tipRows.reduce((sum,row)=>sum+Math.min(65000,row[y]),0));
 const tipValid=team()&&s.bonus==='tip'&&s.tippros>=3&&s.affiliation&&s.used<quota;
 const tipFactor=s.tiprole==='leader'?s.tipshare/100:1;
 const tipYears=tipBases.map(ca=>tipValid?ca*.10*tipFactor:0);
 const tip=tipYears[0]+tipYears[1];
 const tipAnnual=tipYears[0];
 const total=base+prod+teamBase+boost+tipAnnual+growth;
 const current=ca*s.current/100+(team()?s.currentTeam:0)-s.currentPack*12;
 const after=total-pack;
 const packYear2=166.58*12,totalYear2=base+prod+teamBase+tipYears[1],afterYear2=totalYear2-packYear2;
 const agencyEnabled=s.profile==='manager'&&s.agencyEnabled==='yes';
 const agencyCurrentMonthly=agencyEnabled?s.agencyRent+s.agencyStaff+s.agencyPortals+s.agencyFranchise+s.agencyOther:0;
 const agencyFuture=agencyEnabled?s.agencyFuture:0,agencyTransition=agencyEnabled?s.agencyTransition:0;
 const agencyCurrent=current-agencyCurrentMonthly*12;
 const agencyAfter=after-agencyFuture*12-agencyTransition;
 const agencyAfterYear2=afterYear2-agencyFuture*12;
 const agency={currentMonthly:agencyCurrentMonthly,futureMonthly:agencyFuture,transition:agencyTransition,current:agencyCurrent,after:agencyAfter,afterYear2:agencyAfterYear2,gain:agencyAfter-agencyCurrent,gainYear2:agencyAfterYear2-agencyCurrent,gain24:agencyAfter+agencyAfterYear2-agencyCurrent*2};
 const total24=total+totalYear2,after24=after+afterYear2,current24=current*2,gain24=after24-current24;
 return {agency,packYear2,totalYear2,afterYear2,total24,after24,current24,gain24,tipAnnual,tipRows,tipBases,tipYears,tipFactor,boosterCA,newMonths,newTotal,productionExcluded:productionExcluded*s.newCount,otherExcluded,boostRate,ca,base,prod,gross,fees,transactions,eligible,months,saving,pack,teamBase,boost,boostValid,growth,tip,tipValid,total,after,current,gain:after-current,ownGain:base+prod-ca*s.current/100,teamGain:teamBase+boost-(team()?s.currentTeam:0),packGain:s.currentPack*12-pack,entry:0};
}
function valid(){let ok=true;root.querySelectorAll('[data-field],[data-date]').forEach(input=>{if(!input.checkValidity()||input.value===''){ok=false;input.setAttribute('aria-invalid','true');}else{input.removeAttribute('aria-invalid');s[input.dataset.field||input.dataset.date]=input.dataset.field?Number(input.value):input.value;}});let message='Complétez les champs avec des valeurs valides.';
 if(steps()[index]==='booster'&&s.newCount>s.count){ok=false;message='Le nombre de nouveaux conseillers ne peut pas dépasser votre équipe directe.';}
 el('tg-error').textContent=ok?'':message;return ok;}
const line=(t,v)=>`<div class="tg-line"><span>${t}</span><strong>${v}</strong></div>`;
function tipDetails(r){
 if(!team()||s.bonus!=='tip')return '';
 const leader=s.tiprole==='leader';
 return `<section class="tg-separate"><div class="tg-eyebrow">TIP · ${leader?'Team Leader':'manager intégrateur'}</div><h3>${leader?'Votre bonus TIP reversé':'Votre bonus TIP estimé'}</h3><p>Les futures intégrations dans la branche bénéficient aussi du bonus de 10 % pendant la durée restante des 24 mois du TIP.</p>${r.tipValid?`<div class="tg-subtotal">${euro(r.tip)}</div><p>sur <b>24 mois</b>, sous réserve de validation du projet${leader?' et de l’accord de reversement':''}.</p><div class="tg-lines">${line('Bonus · première année',euro(r.tipYears[0]))}${line('Bonus · deuxième année',euro(r.tipYears[1]))}${leader?line('Part du bonus reversée',s.tipshare+' %'):''}</div><details open><summary>Détail du calcul automatique</summary><div class="tg-table-wrap"><table><thead><tr><th>Personne</th><th>CA retenu · an 1</th><th>CA retenu · an 2</th></tr></thead><tbody>${r.tipRows.map((row,i)=>`<tr><td>${i===0?'Team Leader':i<s.tippros?'Conseiller '+i:'Future intégration '+(i-s.tippros+1)}</td><td>${euro(Math.min(row[0],65000))}</td><td>${euro(Math.min(row[1],65000))}</td></tr>`).join('')}</tbody></table></div>${line('Base totale · première année',euro(r.tipBases[0]))}${line('Base totale · deuxième année',euro(r.tipBases[1]))}${line('Taux TIP','10 %')}</details>`:'<p>La projection nécessite au moins 3 professionnels, la condition d’enseigne ou de bassin d’emploi et un quota disponible pour le manager intégrateur.</p>'}<small>Le TIP des 12 premiers mois est inclus dans le gain principal. Le bonus de la deuxième année est compris dans le gain de deuxième année affiché entre parenthèses.</small><details><summary>Hypothèses du TIP</summary><p>Calcul repris du fichier du siège « ALE - simulation Team leader (1).xlsx », onglet « Simulateur Branche TIP Simple », cellules D83:E84 : 10 % du CA retenu, limité à 65 000 € par personne et par année. Les deux années sont saisies séparément. Cette limite est la méthode d’estimation du fichier fourni pour tenir compte de Production+ ; elle ne remplace pas le calcul sur les opérations réellement éligibles.</p><p>Le Team Leader est compris dans la branche. La production personnelle du manager intégrateur en est exclue. Saisir le CA de transactions hors indications d’affaires, gestion locative et recommandations. Les futures intégrations dans la branche sont incluses pendant les 24 mois du TIP, sans limite d’arrivée à 120 jours, selon la mise à jour confirmée par Guillaume le 6 octobre 2026. Leur arrivée ne prolonge pas le dispositif : les montants saisis couvrent uniquement leur activité prévue dans les années 1 et 2 du TIP.</p><p>Le bonus est attribué au manager intégrateur ; sa rétrocession au Team Leader dépend de leur accord. La projection Team Leader applique le pourcentage renseigné, avec 100 % comme exemple du siège. Aucun seuil de 180 000 € n’est appliqué, conformément à la précision de Guillaume du 6 octobre 2026.</p><p>Validation définitive du Comité TIP requise. Début au premier jour du mois suivant la validation ; durée de 24 mois, versements trimestriels. Quotas annuels du manager : Bronze 1, Argent 2, Or 3, Platinum et plus sans limite indiquée. Pas de cumul ajouté avec Booster+ sur les mêmes personnes ou Croissance+.</p></details></section>`;
}

function agencyDetails(r){
 if(s.profile!=='manager'||s.agencyEnabled!=='yes')return '';
 const a=r.agency;
 return `<section class="tg-separate"><div class="tg-eyebrow">Votre budget d’agence intégré</div><h3>Votre comparaison après les charges renseignées.</h3><div class="tg-subtotal">${signed(a.gain)} sur 12 mois</div><p>Écart de scénario, avant cotisations personnelles et impôts. Frais de transition déduits une seule fois.</p><div class="tg-lines">${line('Charges actuelles hors abonnement · par mois',euro(a.currentMonthly))}${line('Charges futures hors pack iad · par mois',euro(a.futureMonthly))}${line('Transition · première année uniquement',euro(a.transition))}${line('Situation actuelle après abonnement et charges · an 1',euro(a.current))}${line('Scénario iad après pack et charges · an 1',euro(a.after))}${line('Écart après charges · an 2',signed(a.gainYear2))}${line('Écart après charges · 24 mois',signed(a.gain24))}</div><p>Les abonnements sont déjà déduits dans les revenus comparés. Les charges saisies ici s’y ajoutent, sans compter deux fois les packs. Hypothèse de charges mensuelles constantes sur deux ans, même périmètre économique pour les deux situations. Cette projection ne représente pas un revenu net disponible et ne garantit aucune économie.</p></section>`;
}
function results(){const r=compute();window.tribuSimulation={reponses:{...s},resultats:r};const pro=s.profile!=='beginner';
 el('tg-stage').textContent='Votre résultat';el('tg-progress').style.width='100%';
 const budgetMode=s.profile==='manager'&&s.agencyEnabled==='yes';
 const displayGain=budgetMode?r.agency.gain:r.gain;
 const displayYear2=budgetMode?r.agency.gainYear2:r.afterYear2-r.current;
 const displayCurrent24=budgetMode?r.agency.current*2:r.current24;
 const displayAfter24=budgetMode?r.agency.after+r.agency.afterYear2:r.after24;
 const comparison=pro?`<div class="tg-result tg-gain"><span>${displayGain>0?'Votre gain supplémentaire estimé avec iad':displayGain<0?'Écart estimé : votre situation actuelle reste supérieure':'Écart estimé avec votre situation actuelle'}</span><div class="tg-total">${signed(displayGain)} <small>sur 12 mois</small></div><div class="tg-month">Soit <b>${signed(displayGain/12)}</b> / mois en moyenne</div><p class="tg-year-two">(Gain estimé en deuxième année : <b>${signed(displayYear2)}</b>*)</p><p class="tg-year-note">* Détail dans le résultat complet.</p><p>${budgetMode?'Après abonnements, charges saisies et frais de transition, avant cotisations personnelles et impôts.':'Après abonnements, avant autres frais et impôts.'} ${s.bonus==='tip'?'Bonus TIP des 12 premiers mois inclus.':s.bonus==='growth'?'Bonus Croissance+ inclus.':''}</p></div><details><summary>Votre comparaison sur 24 mois</summary><div class="tg-compare-grid"><div><small>Votre situation actuelle</small><b>${euro(displayCurrent24)} sur 24 mois</b></div><div><small>Votre scénario iad</small><b>${euro(displayAfter24)} sur 24 mois</b></div></div></details>`:`<div class="tg-result"><span>Commissions estimées sur 12 mois avec iad</span><div class="tg-total">${euro(r.total)}</div><div class="tg-month">Soit <b>${euro(r.total/12)}</b> / mois en moyenne</div><p class="tg-year-two">(Commissions estimées en deuxième année : <b>${euro(r.totalYear2)}</b>*)</p><p class="tg-year-note">* Détail dans le résultat complet.</p></div>`;
 const periodDetail=`<details open><summary>Commissions et abonnements sur 24 mois · avant autres charges</summary>${line('Commissions et bonus · année 1',euro(r.total))}${line('Commissions et bonus · année 2',euro(r.totalYear2))}${s.bonus==='tip'?line('Dont TIP · année 1',euro(r.tipYears[0]))+line('Dont TIP · année 2',euro(r.tipYears[1])):''}${s.bonus==='growth'?line('Dont Croissance+ · période renseignée',euro(r.growth)):''}${line('Pack iad · année 1',price(r.pack))}${line('Pack iad · année 2',price(r.packYear2))}${line('Après pack iad · 24 mois',euro(r.after24))}${pro?line('Situation actuelle après pack · 24 mois',euro(r.current24))+line('Gain supplémentaire · année 1',signed(r.gain))+line('Gain supplémentaire · année 2',signed(r.afterYear2-r.current))+line('Gain total · 24 mois',signed(r.gain24)):''}<p>Projection à activité personnelle, récurrences et situation actuelle constantes. Barème Production+ identique en année 2, sous réserve de reconduction. Starter+ et Booster+ uniquement en première année ; pack standard en deuxième année. Croissance+ est compté une seule fois pour la progression renseignée. Le TIP reprend le CA prévu séparément pour chacune des deux années.</p></details>`;
 const packDetail=`<details open><summary class="cursor-interaction">${pro?'Ancien pack et pack iad : le détail':'Votre pack iad : le détail'}</summary>${r.eligible?line(s.starter==='young'?'Starter+ Jeunes actifs · '+Math.min(r.months,6)+' mois':'Starter+ · '+r.months+' mois',price(s.starter==='young'?19.90:99)+' HT / mois'):''}${r.eligible&&s.starter==='young'&&r.months>6?line('Prolongation · '+(r.months-6)+' mois',price(99)+' HT / mois'):''}${line('Pack iad standard'+(r.months<12?' · '+(12-r.months)+' mois':''),price(166.58)+' HT / mois')}${pro?line('Votre ancien pack',price(s.currentPack)+' HT / mois'):''}${pro?line('Ancien pack sur 12 mois',price(s.currentPack*12)+' HT'):''}${line('Pack iad sur 12 mois, remise incluse',price(r.pack)+' HT')}${line('Pack iad : moyenne mensuelle',price(r.pack/12)+' HT / mois')}${pro?line(r.packGain>=0?'Votre économie sur le pack':'Votre surcoût sur le pack',price(Math.abs(r.packGain))+' HT / an')+line('Soit en moyenne',price(Math.abs(r.packGain)/12)+' HT / mois'):''}</details>`;
 const tipBlock=tipDetails(r);
 const growthBlock=team()&&s.bonus==='growth'?`<section class="tg-separate"><h3>Votre potentiel Croissance+</h3><div class="tg-subtotal">${signed(r.growth)}</div><p>Pour la période juillet–juin étudiée. ${s.cap<5?'Effectif inférieur à 5 au 1er juillet : pas de bonus.':`${s.cap>=30?'15':'10'} % de la progression positive des récurrences.`}</p><small>Bonus de la période étudiée inclus dans le gain de première année. Cumul avec les autres dispositifs soumis à dérogation expresse.</small></section>`:'';
 el('tg-content').innerHTML=`<div class="tg-eyebrow">Votre comparaison personnalisée</div><h2>${pro?'Ce que iad change pour vous.':'Vos ventes, votre équipe, vos avantages.'}</h2>${comparison}${agencyDetails(r)}${periodDetail}<div class="tg-lines"><h3>Détail de la première année</h3>${line('Commissions personnelles à 69 %',euro(r.base))}${line('Production+ après frais du dispositif',signed(r.prod))}${team()?line('Récurrences de votre équipe directe',euro(r.teamBase)):''}${team()&&s.bonus==='booster'?line('Supplément Booster+ uniquement',signed(r.boost)):''}${team()&&s.bonus==='tip'?line('Bonus TIP inclus · première année',signed(r.tipAnnual)):''}${team()&&s.bonus==='growth'?line('Bonus Croissance+ inclus',signed(r.growth)):''}${line('Total des commissions estimées',euro(r.total))}${line('Pack sur 12 factures',euro(r.pack))}${s.starter!=='none'?line('Dont économie Starter+ vs pack standard',euro(r.saving)):''}${line('Après pack, avant autres charges',euro(r.after))}</div>${packDetail}${s.production==='yes'&&s.year!=='2026'?hint('Production+ non appliqué : la reconduction du barème en 2027 n’est pas documentée.'):''}${s.starter!=='none'&&!r.eligible?hint('Starter+ non appliqué : la date d’activation est hors période pour l’offre choisie.'):''}${team()&&s.bonus==='booster'&&!r.boostValid?hint('Booster+ non ajouté : équipe de moins de 5 personnes requise dans cette simulation.'):''}${team()&&s.bonus==='booster'?`<details><summary>Comprendre mon bonus Booster+</summary>${line('Conseillers dans votre équipe',String(s.count))}${line('CA prévu par conseiller sur 12 mois',euro(s.teamca))}${line('Bonus Booster+ supplémentaire',euro(r.boost))}<p>Hypothèse : nouveaux filleuls directs sur une première année complète au taux total de 10 %, effectif inférieur à 5 au 1er juillet de référence. Seul le supplément de 3 points est ajouté aux 7 % déjà comptés. Modèle de ventes mensuelles régulières ; les opérations Production+ sont déduites automatiquement. Estimation sous réserve des conditions du dispositif.</p></details>`:''}${tipBlock}${growthBlock}<details><summary class="cursor-interaction">Hypothèses, dates et conditions</summary><p>Simulation non contractuelle. Montants HT avant frais professionnels, cotisations, impôts et éventuelle TVA non récupérable. Les encaissements sont variables ; la moyenne mensuelle n’est pas un salaire.</p><p>Production : année civile ${s.year}, CA de ${euro(r.ca)}, transactions de même montant. En mode débutant, partage moyen réparti uniformément ; l’ordre réel des ventes et des partages peut modifier le bonus. Les seuils sont appliqués à la transaction suivante : 69 %, puis 75 %, 80 % et 85 %, avec frais de 190 €, 240 € et 290 € par transaction concernée, réduits de moitié en partage.</p><p>Production+ 2026 : supplément brut ${euro(r.gross)}, frais ${euro(r.fees)}. Facturation à partir de février 2027 pour les opérations actées en 2026 et fonds reçus au plus tard le 1er février 2027. Présence dans le réseau, absence de préavis et d’impayés requises. Pas de double bonus avec les TOP nationaux 2026/2027.</p><p>Starter+ : ${r.months} factures remisées sur 12. Offre du 25/03/2025 au 30/06/2027 ; Jeunes actifs à partir du 01/07/2025 avec justificatif étudiant validé. Starter+ standard : jusqu’à 6 mois, renouvelable jusqu’à 6 mois avec 50 apporteurs Propertips ; arrêt dès la première vente, y compris pendant les 6 premiers mois. Précision fournie par Guillaume le 06/10/2026, distincte du règlement initial. Hypothèse mensuelle : mois de vente au tarif standard, sans prorata. Jeunes actifs : conditions initiales conservées. La comparaison est un budget annuel : les 12 factures après activation peuvent différer de l’année civile des commissions.</p><p>Booster+ : uniquement le supplément de 3 points sur le CA calculé automatiquement. Fenêtre individuelle de 12 mois et exclusions à contrôler ; pas de préavis ni d’impayés. Croissance+ : périodes juillet–juin, effectif figé au 1er juillet, paiement sur facture à partir d’octobre sous conditions.</p><p>Sources : règlements iad Production+ (application 2026), Starter+ (25/03/2025–30/06/2027), Booster+ (notice du 01/07/2026), Croissance+ v2025.01 fiche TIP et simulateur du siège « ALE - simulation Team leader (1).xlsx » fournis le 6 octobre 2026. Estimation indicative, selon les hypothèses affichées.</p></details>${r.transactions.length?`<details><summary class="cursor-interaction">Contrôler Production+ transaction par transaction</summary><div class="tg-table-wrap"><table><thead><tr><th>Vente</th><th>Taux</th><th>Bonus brut</th><th>Frais</th></tr></thead><tbody>${r.transactions.map(([n,prior,rate,b,f])=>`<tr><td>${n}</td><td>${Math.round(rate*100)} %</td><td>${euro(b)}</td><td>${euro(f)}</td></tr>`).join('')}</tbody></table></div></details>`:''}`;
 window.parent.postMessage({type:'tribu-simulator-results'},location.origin);
 el('tg-back').hidden=false;el('tg-back').textContent='← Dernière question';el('tg-next').textContent='Modifier mes réponses';}
function render(){el('tg-error').textContent='';const list=steps();if(index>=list.length){results();return;}
 const [eye,title,sub,body]=pages[list[index]]();el('tg-stage').textContent=`Question ${index+1} sur ${list.length}`;el('tg-progress').style.width=((index+1)/list.length*100)+'%';el('tg-content').innerHTML=`<div class="tg-eyebrow">${eye}</div><h2>${title}</h2><p>${sub}</p>${body}`;
 el('tg-back').hidden=index===0;el('tg-back').textContent='← Retour';el('tg-next').textContent=index===list.length-1?'Voir mon gain estimé →':'Continuer →';
 root.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>{if(!valid())return;s[b.dataset.key]=b.dataset.value;render();}));
 root.querySelectorAll('[data-example]').forEach(b=>b.addEventListener('click',()=>{const input=el('tg-'+b.dataset.example);input.value=b.dataset.amount;s[b.dataset.example]=Number(b.dataset.amount);input.removeAttribute('aria-invalid');el('tg-error').textContent='';input.focus();}));
 root.querySelectorAll('[data-select]').forEach(i=>i.addEventListener('change',()=>{s[i.dataset.select]=i.value;if(i.dataset.select==='year'||i.dataset.select==='special'){valid();render();}}));
 root.querySelectorAll('[data-date="newStart"]').forEach(i=>i.addEventListener('change',()=>{if(valid())render();}));
 root.querySelectorAll('[data-check]').forEach(i=>i.addEventListener('change',()=>{s[i.dataset.check]=i.checked;if(i.dataset.check==='student')render();}));
 root.querySelectorAll('[data-field],[data-date]').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el('tg-next').click();}}));}
el('tg-next').addEventListener('click',()=>{if(index>=steps().length){index=0;render();}else if(valid()){index++;render();}});
el('tg-back').addEventListener('click',()=>{if(index<steps().length)valid();index=Math.max(0,index-1);render();});
render();
})();
</script>
