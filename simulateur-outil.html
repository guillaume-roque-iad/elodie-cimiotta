<p class="foot">Estimation selon vos réponses et les conditions des dispositifs iad.</p>
<script>
(()=>{
const root=document.getElementById('simq'),el=id=>root.querySelector('#sq-'+id);
const a={profile:'solo',fee:8000,y1:4,y2:8,y3:11,first:13,starter:6,ca:90000,sales:11,rate:70,network:250,agencyCA:250000,retro:80000,currentRec:0,charges:'no',rent:0,payroll:0,portals:0,franchise:0,other:0,future:0,transition:0,team:'no',direct:2,dca:45000,indirect:0,ica:40000,origin:'same'};
const choice=(key,title,hint,options)=>({key,title,hint,options});
const field=(key,title,hint,fields)=>({key,title,hint,fields});
const n=(key,label,min=0,max=10000000,step=1)=>({key,label,min,max,step});
function steps(){let s=[choice('profile','Et si on partait de votre situation ?','Quelques questions pour construire votre simulation, à votre rythme.',[['neo','Je découvre l’immobilier','Je souhaite me lancer ou me reconvertir.'],['solo','Je suis mandataire sans équipe','Je compare mon pourcentage de commission et mon pack.'],['team','Je suis mandataire avec une équipe','Je compare mes commissions, mon pack et mes récurrences.'],['agency','Je suis patron d’agence','Je renseigne le CA de mon agence et mes charges de structure.']])];
if(a.profile==='neo')s.push(field('fee','Quels honoraires moyens imaginez-vous par vente ?','Il s’agit des honoraires HT de l’agence, avant votre rémunération.',[n('fee','Honoraires moyens par vente (€ HT)',1)]),field('production','Combien de ventes envisagez-vous ?','Des hypothèses modifiables, pas un objectif imposé.',[n('y1','Année 1 — ventes',0,1000),n('y2','Année 2 — ventes',0,1000),n('y3','Année 3 — ventes',0,1000)]),field('first','Quand pensez-vous encaisser votre première vente ?','Le délai sert uniquement à estimer le coût du pack la première année.',[n('first','Nombre de mois',1,12)]),choice('starter','Quelle durée maximale de pack réduit voulez-vous tester ?','Hypothèse : 99 € HT/mois jusqu’à la première vente, puis 166,58 €. La prolongation doit être confirmée selon votre situation.',[[6,'6 mois maximum','Hypothèse du simulateur de référence.'],[12,'12 mois maximum','Uniquement si la prolongation est applicable.'],[0,'Sans réduction','Pack standard dès le démarrage.']]));
else {
s.push(field('activity','Quel est votre niveau d’activité personnel ?','Indiquez vos honoraires personnels et vos ventes, sans inclure la production des collaborateurs.',[n('ca','CA honoraires personnel annuel (€ HT)'),n('sales','Nombre de ventes personnelles par an',0,1000)]));
if(a.profile==='agency')s.push(field('agencyRevenue','Quel chiffre d’affaires réalise votre agence ?','CA honoraires annuel total de la structure, incluant votre production personnelle et celle des collaborateurs. Les rétrocessions aux indépendants sont déduites séparément, les salaires seront saisis à l’étape des charges.',[n('agencyCA','CA honoraires annuel total de l’agence (€ HT)'),n('retro','Commissions reversées aux indépendants par an (€ HT)')]));
else s.push(field('current','Quel pourcentage de commission touchez-vous ?','Saisissez le pourcentage qui vous revient sur vos honoraires personnels et le prix mensuel de votre pack actuel.',[n('rate','Pourcentage de commission perçu (%)',0,100,.1),n('network','Prix du pack actuel (€ HT/mois)',0,100000,.01)]));
if(a.profile==='team')s.push(field('currentTeam','Quelles récurrences votre équipe vous rapporte-t-elle aujourd’hui ?','Total annuel effectivement perçu sur votre équipe, avant cotisations et impôts. Il s’ajoute à vos commissions personnelles pour comparer votre situation actuelle.',[n('currentRec','Récurrences actuelles de votre équipe (€ HT/an)')]));
}

if(a.profile!=='agency')s.push(choice('charges','Souhaitez-vous intégrer vos frais professionnels ?','Pour comparer à périmètre équivalent, distinguez les dépenses actuelles et celles conservées chez iad.',[['no','Non, pour ce premier aperçu','Les autres frais professionnels seront exclus.'],['yes','Oui, je précise mes charges','Loyer, salaires, portails, franchise et autres dépenses.']]));
if(a.charges==='yes'){if(a.profile!=='neo')s.push(field('costs',a.profile==='agency'?'Quels sont les frais de votre structure ?':'Quels autres frais professionnels avez-vous ?',a.profile==='agency'?'Montants mensuels HT de toute l’agence. Incluez les rémunérations salariées et charges employeur, mais pas les commissions aux indépendants déjà saisies. Renseignez zéro pour un poste absent.':'Montants mensuels HT, hors pack déjà saisi. Renseignez uniquement les frais à votre charge.',[n('rent','Loyer'),n('payroll','Salaires et charges employeur'),n('portals','Portails et diffusion'),n('franchise','Redevance / franchise'),n('other','Véhicule, comptabilité, assurances, autres')]));s.push(field('future','Quels frais prévoyez-vous chez iad ?','Hors pack iad, déjà calculé. Ne supposez pas que toutes vos dépenses disparaissent.',[n('future','Autres frais professionnels (€ HT/mois)'),n('transition',a.profile==='neo'?'Frais de lancement ponctuels (€ HT)':'Frais de transition ponctuels (€ HT)')]));}
if(a.profile!=='team')s.push(choice('team','Souhaitez-vous aussi simuler une équipe ?',a.profile==='neo'?'L’équipe est simulée à partir de l’année 2.':'Les récurrences seront présentées séparément de vos ventes.',[['no','Non, mes ventes uniquement','Je me concentre sur mon activité personnelle.'],['yes','Oui, avec une équipe','Je renseigne mes propres hypothèses de production.']]));
if(a.team==='yes'){s.push(field('direct','Combien de conseillers parraineriez-vous directement ?','Le CA est une moyenne annuelle par conseiller. Effectifs supposés actifs toute l’année ; accès aux niveaux selon votre qualification.',[n('direct','Nombre de filleuls directs',0,1000),n('dca','CA annuel moyen par filleul (€ HT)')]));if(a.profile!=='neo')s.push(field('indirect','Vos filleuls développent-ils aussi une équipe ?','Vous pouvez laisser zéro. Il s’agit du nombre total de conseillers au deuxième niveau.',[n('indirect','Conseillers au deuxième niveau',0,1000),n('ica','CA annuel moyen par conseiller (€ HT)')]));if(a.profile==='team'||a.profile==='agency')s.push(choice('origin','D’où viennent les professionnels qui vous suivent ?','Cette réponse prépare l’étude du programme d’intégration ; elle ne vaut pas accord iad.',[['same','De la même enseigne','Vous partagez la même enseigne.'],['local','Du même bassin d’emploi','Vous exercez sous des enseignes différentes.'],['far','D’enseignes et de secteurs différents','La situation nécessite une étude spécifique.']]));}
return s;}

 el('content').innerHTML=`<div class="flat-heading"><h2>Comparez votre activité avec iad</h2><p>Modifiez vos chiffres : le résultat se met à jour immédiatement.</p></div><div class="flat-profile"><label>Votre situation<select id="sq-flat-profile">${Object.entries(labels).map(([key,label])=>`<option value="${key}" ${a.profile===key?'selected':''}>${label}</option>`).join('')}</select></label>${['neo','agency'].includes(a.profile)?`<label>Équipe à simuler<select id="sq-flat-team"><option value="no" ${a.withTeam==='no'?'selected':''}>Sans équipe</option><option value="yes" ${a.withTeam==='yes'?'selected':''}>Avec une équipe</option></select></label>`:''}</div><div class="flat-layout"><section class="flat-inputs"><h3>Vos chiffres</h3><div class="flat-fields">${fields.map(inputHTML).join('')}</div></section><section class="flat-output"><div class="flat-output-head"><h3>Votre comparaison</h3><div class="periods"><button type="button" data-period="12" aria-pressed="${horizon===12}">12 mois</button><button type="button" data-period="24" aria-pressed="${horizon===24}">24 mois</button></div></div><div id="sq-panels" aria-live="polite">${flatResult()}</div></section></div><details id="sq-refine" ${refineOpen?'open':''}><summary class="refine-button">Dispositifs + et réglages détaillés</summary>${advancedMarkup()}</details>`;
 root.querySelector('#sq-flat-profile').onchange=e=>{
  const p=e.target.value;a.experience=p==='neo'?'new':'pro';a.withAgency=p==='agency'?'yes':'no';a.withTeam=p==='team'?'yes':'no';a.charges=p==='agency'?'yes':'no';a.device='none';a.indirect=0;
  // Recover unfinished edits when changing situation, rather than retaining NaN.
  for(const [key,value] of Object.entries(flatValid))if(!Number.isFinite(a[key])&&typeof a[key]==='number')a[key]=value;
  syncSituation();render();
 };
 const teamSelect=root.querySelector('#sq-flat-team');if(teamSelect)teamSelect.onchange=e=>{a.withTeam=e.target.value;a.device='none';syncSituation();render();};
 el('content').querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{horizon=Number(b.dataset.period);refineOpen=root.querySelector('#sq-refine').open;render();});
 el('content').querySelectorAll('input[data-key]').forEach(input=>input.oninput=()=>{
  const key=input.dataset.key;const value=input.value!==''&&input.checkValidity()?Number(input.value):NaN;a[key]=value;if(Number.isFinite(value))flatValid[key]=value;
  if(key==='other'&&a.profile==='agency'){a.rent=0;a.payroll=0;a.portals=0;a.franchise=0;}
  // Synchronize fields repeated in the optional detailed settings.
  el('content').querySelectorAll('input[data-key]').forEach(peer=>{if(peer!==input&&peer.dataset.key===key)peer.value=input.value;});
  root.querySelector('#sq-panels').innerHTML=flatResult();
 });
 el('content').querySelectorAll('[data-select]').forEach(sel=>sel.onchange=()=>{a[sel.dataset.select]=sel.value;if(sel.dataset.select==='team')a.withTeam=sel.value;refineOpen=true;render();});
};
const flatValid=Object.fromEntries(Object.entries(a).filter(([key,value])=>typeof value==='number'));
result=render;
render();

function deviceQuestions(device){
 const saved=a.device,team=a.team;a.device=device;
 const all=expertSteps();a.device=saved;a.team=team;
 const keys={starter:['startEligible','starterFacts'],booster:['boostEligible','boostCohort','boostDetails'],growth:['cap','growthAmounts','cap2'],tip:['tipRole','tipLevel','tipPeople','tipOrigin','tipActivity','tipApproved','tipTransfer']};
 return all.filter(q=>keys[device].includes(q.key));
}
function deviceControls(device){return deviceQuestions(device).map(q=>`<div class="device-control">${q.options?`<label>${q.title}<select data-select="${q.key}">${q.options.map(o=>`<option value="${o[0]}" ${String(a[q.key])===String(o[0])?'selected':''}>${o[1]}</option>`).join('')}</select></label>`:`<div class="fields">${q.fields.map(inputHTML).join('')}</div>`}<p>${q.hint.replaceAll('ton support','le support').replaceAll('ton précédent simulateur','la simulation de référence')}</p></div>`).join('');}
function deviceSummary(key){
 const rows=calculate().slice(0,horizon===12?1:2),total=k=>rows.reduce((s,r)=>s+(r[k]||0),0);
 if(Object.values(a).some(v=>typeof v==='number'&&!Number.isFinite(v)))return 'Complétez le montant en cours.';
 if(key==='starter')return a.startEligible==='yes'?`<strong>${money(total('starterSaving'))} d’économie de pack</strong><span>Déjà intégrée au résultat · Éligibilité à confirmer</span>`:'<strong>Non retenu dans cette simulation</strong><span>Pack standard sélectionné.</span>';
 if(key==='production'){
  const gain=rows.reduce((s,r)=>s+r.gross-r.fees-r.ca*.69,0);
  return gain>0?`<strong>${money(gain)} de supplément estimé</strong><span>Déjà intégré · Après frais administratifs Production+</span>`:'<strong>Pas de supplément sur la période</strong><span>Le seuil avant une vente n’est pas atteint dans cette projection.</span>';
 }
 if(key==='booster'){
  const available=a.boostEligible==='yes'&&a.boostBase<=a.direct*a.dca;
  const amount=a.boostBase*(a.boostCohort==='2'?.07:.03)*a.boostMonths/12;
  return available?`<strong>${money(a.profile==='neo'&&horizon===12?0:amount)} de bonus potentiel</strong><span>Conditions déclarées · ${a.device==='booster'?'Inclus dans le résultat':'Scénario séparé du résultat'}</span>`:'<strong>Éligibilité à confirmer</strong><span>Moins de 5 filleuls au 1er juillet de référence, nouvelles activations admissibles, hors TIP.</span>';
 }
 const saved=a.device;a.device=key;const p=plusResults();a.device=saved;
 if(key==='growth')return Number(a.cap)>0||horizon===24&&Number(a.cap2)>0?`<strong>${money(p.growth.slice(0,horizon===12?1:2).reduce((s,v)=>s+v,0))} de bonus potentiel</strong><span>Scénario séparé · Exercices juillet–juin · CAP et progression à confirmer</span>`:'<strong>Accessible à partir du CAP 5</strong><span>À étudier selon votre qualification au 1er juillet et la progression de vos récurrences.</span>';
 if(a.tipPros<3)return '<strong>Au moins 3 professionnels requis</strong><span>Renseignez les professionnels présents à l’intégration dans les conditions TIP.</span>';
 return `<strong>${p.issue?'Conditions à compléter':money(p.share.slice(0,horizon===12?1:2).reduce((s,v)=>s+v,0))+' de bonus potentiel'}</strong><span>${p.issue||'Scénario séparé · '+(a.tipApproved==='yes'?'Validation déclarée':'Sous réserve du Comité TIP')+' · Reversement au Team Leader à convenir'}</span>`;
}
function automaticDevices(){
 const defs=[['starter','Starter+','Réduction du pack au démarrage'],['production','Production+','Commission liée à votre production']];
 if(a.team==='yes')defs.push(['booster','Booster+','Nouveaux filleuls éligibles'],['growth','Croissance+','Progression des récurrences']);
 if(a.team==='yes'&&a.profile!=='neo')defs.push(['tip','TIP','<strong>Vous rejoignez iad avec votre équipe ?</strong> Vous êtes le Team Leader entrant.<br><strong>Vous accueillez cette équipe chez iad ?</strong> Vous êtes le manager intégrateur.']);
 return `<section class="auto-devices"><h3>Les dispositifs pour votre projet</h3><p class="device-intro">Estimations sur ${horizon} mois. Les conditions restent à vérifier ; les bonus d’équipe ne s’additionnent pas automatiquement.</p><div class="device-grid">${defs.map(([key,name,sub])=>`<article class="device-card"><h4>${name}</h4><p>${sub}</p><div id="sq-device-${key}" class="device-status">${deviceSummary(key)}</div>${key==='production'?'':`<details><summary>Conditions et simulation</summary>${deviceControls(key)}</details>`}</article>`).join('')}</div></section>`;
}
const beforeDeviceRender=render;
render=function(){
 beforeDeviceRender();
 root.querySelector('#sq-refine').insertAdjacentHTML('beforebegin',automaticDevices());
 const updateStatuses=()=>{for(const key of ['starter','production','booster','growth','tip']){const node=root.querySelector('#sq-device-'+key);if(node)node.innerHTML=deviceSummary(key);}};
 el('content').querySelectorAll('input[data-key]').forEach(input=>{input.oninput=()=>{
  const key=input.dataset.key,value=input.value!==''&&input.checkValidity()?Number(input.value):NaN;a[key]=value;if(Number.isFinite(value))flatValid[key]=value;
  if(key==='other'&&a.profile==='agency'){a.rent=0;a.payroll=0;a.portals=0;a.franchise=0;}
  el('content').querySelectorAll('input[data-key]').forEach(peer=>{if(peer!==input&&peer.dataset.key===key)peer.value=input.value;});
  root.querySelector('#sq-panels').innerHTML=flatResult();updateStatuses();
 };});
 el('content').querySelectorAll('[data-select]').forEach(sel=>sel.onchange=()=>{a[sel.dataset.select]=sel.value;if(sel.dataset.select==='team')a.withTeam=sel.value;render();});
};
result=render;
render();

const resultBeforeTipGain=flatResult;
flatResult=function(){
 const html=resultBeforeTipGain();
 if(a.team!=='yes'||a.profile==='neo'||Object.values(a).some(v=>typeof v==='number'&&!Number.isFinite(v)))return html;
 const selected=a.device;a.device='tip';const estimate=plusResults();a.device=selected;
 const amount=estimate.share.slice(0,horizon===12?1:2).reduce((sum,v)=>sum+v,0);
 const beneficiary=a.tipRole==='leader'?`Part du Team Leader : ${a.tipShare} % du bonus`:'Bonus du manager intégrateur';
 const block=`<div class="tip-extra"><span>Gain supplémentaire TIP · ${horizon} mois</span><strong>${estimate.issue?'À compléter':'+'+money(amount)}</strong><p>${estimate.issue||beneficiary+' · '+(a.tipApproved==='yes'?'Validation déclarée.':'Sous réserve de validation du Comité TIP.')}</p><p>Présenté séparément du montant « Avec iad ». Le cumul avec les autres bonus doit être vérifié.</p></div>`;
 return block+html;
};
render();

function explicitTipAmount(){
 const invalid=['tipBase1','tipBase2','tipPros','tipPros2','tipMonths','tipShare','tipUsed'].some(k=>!Number.isFinite(Number(a[k])));
 if(invalid)return '<strong>Montant à compléter</strong><span>Renseignez les valeurs du dossier TIP pour calculer le bonus.</span>';
 const selected=a.device;a.device='tip';const data=plusResults();a.device=selected;
 if(data.issue)return `<strong>Montant non calculable</strong><span>${data.issue}</span><span>Ouvrez « Conditions et simulation » pour corriger le dossier.</span>`;
 const years=data.share,total=years[0]+years[1],shown=horizon===12?years[0]:total;
 return `<strong class="tip-main-amount">+${money(shown)} sur ${horizon} mois</strong><div class="tip-year-amounts"><div><span>Année 1</span><b>${money(years[0])}</b></div><div><span>Année 2</span><b>${money(years[1])}</b></div><div><span>Total sur 24 mois</span><b>${money(total)}</b></div></div><span>${a.tipRole==='leader'?`Part du Team Leader : ${a.tipShare} % du bonus, selon accord`:'Bonus versé au manager intégrateur'}.</span><span>Hypothèses de CA éligible : ${money(a.tipBase1)} en année 1 et ${money(a.tipBase2)} en année 2. ${a.tipApproved==='yes'?'Validation déclarée.':'Sous réserve de validation du Comité TIP.'}</span>`;
}
const priorDeviceSummary=deviceSummary;
deviceSummary=function(key){return key==='tip'?explicitTipAmount():priorDeviceSummary(key);};
flatResult=function(){
 const base=resultBeforeTipGain();
 if(a.team!=='yes'||a.profile==='neo')return base;
 return `<div class="tip-extra"><span>Votre gain supplémentaire TIP</span>${explicitTipAmount()}<p>Bonus présenté séparément du montant « Avec iad », sans cumul automatique avec les autres dispositifs.</p></div>`+base;
};
render();

Object.assign(a,{tipCA1:40000,tipCA2:50000,tipNewPros:0,tipNewMonths:12});
function tipProjection(){
 const count=a.tipPros,newCount=a.tipNewPros,annual1=Math.min(a.tipCA1,65000),annual2=Math.min(a.tipCA2,65000);
 const base1=count*annual1,base2=(count+newCount*a.tipNewMonths/12)*annual2;
 const issue=count<3?'Au moins 3 professionnels sont requis à l’intégration.':a.tipOrigin==='far'?'Le critère d’enseigne ou de bassin d’emploi n’est pas rempli.':a.tipLevel!=='unlimited'&&a.tipUsed>=Number(a.tipLevel)?'Le quota annuel du manager est atteint.':'';
 const factor=a.tipRole==='leader'?a.tipShare/100:1;
 const amounts=issue?[0,0]:[base1*.1*Math.min(12,a.tipMonths)/12,base2*.1*Math.max(0,a.tipMonths-12)/12];
 return {base1,base2,totalPeople:count+newCount,issue,tip:amounts,share:amounts.map(v=>v*factor)};
}
const preGrowthPlus=plusResults;
plusResults=function(){const prior=preGrowthPlus();if(a.device!=='tip')return prior;const p=tipProjection();return {...prior,...p};};
const preGrowthQuestions=deviceQuestions;
deviceQuestions=function(device){
 if(device!=='tip')return preGrowthQuestions(device);
 let qs=preGrowthQuestions(device).filter(q=>!['tipPeople','tipActivity'].includes(q.key));
 qs.splice(2,0,field('tipGrowthInputs','Votre équipe TIP','Le CA est plafonné à 65 000 € par personne et par an dans le calcul. Les nouveaux entrants restent soumis aux conditions du TIP et à sa fenêtre de 24 mois.',[
 n('tipPros','Professionnels présents au départ',1,1000),
 n('tipCA1','CA moyen par personne — année 1 (€ HT)',0,10000000),
 n('tipNewPros','Nouveaux professionnels en année 2',0,1000),
 n('tipCA2','CA annuel moyen par personne — année 2 (€ HT)',0,10000000),
 n('tipNewMonths','Mois moyens de présence des nouveaux en année 2',0,12),
 n('tipUsed','TIP déjà utilisés par le manager cette année',0,1000)
 ]));
 return qs;
};
explicitTipAmount=function(){
 const keys=['tipPros','tipCA1','tipCA2','tipNewPros','tipNewMonths','tipShare','tipUsed'];
 if(keys.some(k=>!Number.isFinite(a[k])))return '<strong>Montant à compléter</strong><span>Terminez la saisie pour actualiser le calcul.</span>';
 const p=tipProjection();if(p.issue)return `<strong>Montant non calculable</strong><span>${p.issue}</span>`;
 const total=p.share[0]+p.share[1],shown=horizon===12?p.share[0]:total;
 return `<strong class="tip-main-amount">+${money(shown)} sur ${horizon} mois</strong><div class="tip-year-amounts"><div><span>Année 1 · ${a.tipPros} professionnels</span><b>${money(p.share[0])}</b></div><div><span>Année 2 · ${p.totalPeople} professionnels</span><b>${money(p.share[1])}</b></div><div><span>Total sur 24 mois</span><b>${money(total)}</b></div></div><span>Bases de CA retenues : ${money(p.base1)} puis ${money(p.base2)}. Plafond : 65 000 € par personne/an.</span><span>${a.tipNewPros} nouvel entrant${a.tipNewPros>1?'s':''} en année 2, pendant ${a.tipNewMonths} mois en moyenne. CA moyen hors activités exclues du TIP.</span><span>${a.tipRole==='leader'?`Reversement simulé au Team Leader : ${a.tipShare} %.`:'Bonus du manager intégrateur.'} Sous réserve des conditions et de validation du TIP.</span>`;
};
// Keep one authoritative set of TIP controls; remove older duplicate TIP fields.
const preGrowthAdvanced=advancedMarkup;
advancedMarkup=function(){
 const selected=a.device;if(selected==='tip')a.device='none';const html=preGrowthAdvanced();a.device=selected;return html;
};
a.tipMonths=24;
for(const key of ['tipCA1','tipCA2','tipNewPros','tipNewMonths'])flatValid[key]=a[key];
render();


let leadUnlocked=false, leadSending=false, leadDraft={}, leadSubmissionId='';
const LEAD_ENDPOINT='https://script.google.com/macros/s/AKfycbz6ZtOtnaGlVn0vLQr-kBl5aIjmCr2oCBlfJFzq8EiVZVpsG4gTRREGtLxAWQFbn8360Q/exec', LEAD_SOURCE='Team Lucky', LEAD_CONTACT='Élodie Cimiotta';
const ungatedResult=flatResult,ungatedDevices=automaticDevices;
function leadGateMarkup(){
 const error=currentProblem(),invalid=Object.values(a).some(v=>typeof v==='number'&&!Number.isFinite(v));
 if(error||invalid)return '<p class="error">Complétez vos chiffres pour comparer votre situation.</p>';
 const rows=calculate().slice(0,horizon===12?1:2),delta=rows.reduce((s,r)=>s+r.net-(r.now||0),0);
 const headline=a.profile==='neo'?'Votre estimation est prête':delta>0?'Vous gagneriez plus avec iad':delta<0?'Vous gagneriez moins avec iad':'Votre résultat serait équivalent';
 return `<div class="lead-teaser"><h3>${headline}</h3><p>${a.profile==='neo'?'Découvrez votre projection détaillée.':'Selon vos données, avant cotisations et impôts, hors bonus TIP et Croissance+.'}</p></div>
 <form id="sq-lead-form"><h3>Découvrez vos montants</h3><p>Renseignez vos coordonnées pour accéder au détail de votre simulation.</p>
 <div class="lead-fields">
 <label>Prénom<input name="givenName" autocomplete="given-name" required maxlength="80"></label>
 <label>Nom<input name="familyName" autocomplete="family-name" required maxlength="80"></label>
 <label>Email<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
 <label>Téléphone<input name="phone" type="tel" autocomplete="tel" inputmode="tel" required pattern="[+0-9 ().\\-]{8,25}" maxlength="25"></label>
 <label>Ville / secteur<input name="ville" autocomplete="address-level2" required maxlength="120"></label>
 <label>Quand souhaitez-vous échanger ?<select name="disponibilite"><option value="Je souhaite d’abord consulter ma simulation">Je consulte d’abord ma simulation</option><option>Cette semaine</option><option>La semaine prochaine</option><option>Dans le mois</option></select></label></div>
 <div style="position:absolute;left:-10000px" aria-hidden="true"><label>Société<input name="societe" tabindex="-1" autocomplete="off"></label></div>
 <label class="lead-agreement"><input name="contact" type="checkbox" required><span>J’accepte d’être recontacté(e) par Élodie Cimiotta au sujet de ma simulation et de mon projet immobilier.</span></label>
 <label class="lead-agreement"><input name="newsletter" type="checkbox"><span>Je souhaite recevoir la newsletter recrutement Tribu Immo : métier de conseiller, réseau iad et prochaines présentations. Désinscription possible à tout moment.</span></label>
 <button type="submit" class="next" ${leadSending?'disabled':''}>${leadSending?'Enregistrement en cours…':'Voir ma simulation détaillée'}</button>
 <p id="sq-lead-error" class="error" role="alert" hidden></p>
 <p class="lead-test">Vos informations et votre simulation sont transmises à l’équipe pour traiter votre demande. <a href="/mentions-legales" target="_top">Confidentialité et droits</a>.</p></form>`;
}
flatResult=function(){return leadUnlocked?ungatedResult():leadGateMarkup();};
automaticDevices=function(){return leadUnlocked?ungatedDevices():'';};
const beforeGateRender=render;
render=function(){
 beforeGateRender();
 const refine=root.querySelector('#sq-refine');if(refine)refine.hidden=!leadUnlocked;
 wireLeadGate();
 el('content').querySelectorAll('input[data-key]').forEach(input=>{const previous=input.oninput;input.oninput=()=>{previous();wireLeadGate();};});
};
function wireLeadGate(){
 const form=root.querySelector('#sq-lead-form');if(!form)return;
 for(const input of form.elements){if(!input.name)continue;if(Object.hasOwn(leadDraft,input.name)){if(input.type==='checkbox')input.checked=leadDraft[input.name];else input.value=leadDraft[input.name];}}
 form.oninput=form.onchange=()=>{for(const input of form.elements){if(input.name)leadDraft[input.name]=input.type==='checkbox'?input.checked:input.value;}};
 form.onsubmit=async event=>{
  event.preventDefault();if(leadSending||!form.reportValidity())return;
  form.oninput();const values=new FormData(form);if(values.get('societe'))return;
  leadSending=true;if(!leadSubmissionId)leadSubmissionId=crypto.randomUUID();
  const button=form.querySelector('[type="submit"]');button.disabled=true;button.textContent='Enregistrement en cours…';
  const status=form.querySelector('#sq-lead-error');status.hidden=true;
  const body=new FormData(),labels={neo:'Je débute dans l’immobilier',solo:'Mandataire sans équipe',team:'Mandataire avec équipe',agency:'Dirigeant d’agence'};
  body.set('action','lead_capture');body.set('source_site',LEAD_SOURCE);body.set('submission_id',leadSubmissionId);
  body.set('nom',(values.get('givenName')+' '+values.get('familyName')).trim());body.set('email',values.get('email'));body.set('telephone',values.get('phone'));body.set('ville',values.get('ville'));
  body.set('situation',labels[a.profile]);body.set('disponibilite',values.get('disponibilite'));body.set('consentement','Accord pour être recontacté par '+LEAD_CONTACT+' au sujet de la simulation');body.set('newsletter',values.has('newsletter')?'oui':'non');
  body.set('simulation',JSON.stringify({version:'2026-10-11-tableau',horizon,reponses:{...a},resultats:calculate(),tip:typeof tipProjection==='function'?tipProjection():null}));
  body.set('page',location.href);body.set('referent',document.referrer);
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);
  try{
   const response=await fetch(LEAD_ENDPOINT,{method:'POST',body,signal:controller.signal});
   if(!response.ok)throw Error('Enregistrement non confirmé');const saved=await response.json();
   if(saved.ok!==true||saved.saved!==true)throw Error('Enregistrement non confirmé');
   leadUnlocked=true;leadDraft={};render();
   const output=root.querySelector('.flat-output');if(output)output.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(error){
   const current=root.querySelector('#sq-lead-form');if(current){const msg=current.querySelector('#sq-lead-error');msg.textContent='L’enregistrement n’a pas été confirmé. Vos réponses sont conservées : réessayez dans quelques instants.';msg.hidden=false;const b=current.querySelector('[type="submit"]');b.disabled=false;b.textContent='Réessayer et voir ma simulation';}
  }finally{clearTimeout(timer);leadSending=false;}
 };
}
const startProfile=new URLSearchParams(location.search).get('profil');
if(startProfile==='equipe'){a.profile='team';a.team='yes';a.withTeam='yes';}
result=render;
render();

})();
</script>
</div></body></html>
